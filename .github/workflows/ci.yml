name: CI

# Builds the plugin and runs the tests on Windows, macOS and Linux for every push to master and every pull request.
# The packages (installer, zips) are attached to the run as artifacts so they can be tried without making a release.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (VST3)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # JUCE, Catch2 and nlohmann/json are fetched into third_party/ by CMake; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Build and test
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset release || exit /b 1
          cmake --build --preset release || exit /b 1
          ctest --preset release || exit /b 1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package
        shell: pwsh
        run: ./package.ps1 -SkipBuild

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*

  macos:
    name: macOS (VST3 + AU, universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Compiler cache: only the files that changed are rebuilt (JUCE is most of the build time).
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-macos
          max-size: 500M

      - uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Tools
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Build
        run: |
          cmake --preset release-macos -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset release-macos

      - name: Test
        run: ctest --preset release-macos

      - name: Package
        run: ./package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*

  linux:
    name: Linux (VST3 + Standalone)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Compiler cache: only the files that changed are rebuilt (JUCE is most of the build time).
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-linux
          max-size: 500M

      - uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Build
        run: |
          cmake --preset release-linux -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset release-linux

      - name: Test
        run: xvfb-run -a ctest --preset release-linux

      - name: Package
        run: ./package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
